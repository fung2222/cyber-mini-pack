<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05010f">
<meta name="description" content="賽博小遊戲 CYBER MINI PACK — 包剪揼、過三關、神經反射三合一無盡挑戰。Rock-paper-scissors, tic-tac-toe and a reaction test as endless 3D cyberpunk challenges.">
<title data-i18n="doc.title">CYBER MINI PACK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%2305010f%22/%3E%3Ccircle cx=%229%22 cy=%2210%22 r=%225%22 fill=%22none%22 stroke=%22%2300e5ff%22 stroke-width=%222%22/%3E%3Cpath d=%22M18 5l8 8M26 5l-8 8%22 stroke=%22%23ff2bd6%22 stroke-width=%222.4%22/%3E%3Ccircle cx=%2216%22 cy=%2223%22 r=%225%22 fill=%22%233bff8a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/cyber-kit/ui/hud.css">
<link rel="stylesheet" href="./css/game.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/cyber-kit/three/three.module.min.js",
    "three/addons/": "./vendor/cyber-kit/three/addons/",
    "cyber-kit": "./vendor/cyber-kit/kit.js",
    "cyber-kit/": "./vendor/cyber-kit/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="fx-flash"></div>
<div id="scanlines"></div>

<div id="hud" class="hidden">
  <div class="hud-panel hud-left">
    <div class="stat"><div class="label" id="hud-mode"></div><div class="value" id="hud-opp"></div></div>
  </div>
  <div class="hud-panel hud-right">
    <div class="stat"><div class="label" id="hud-stat-label"></div><div class="value big" id="hud-stat">0</div></div>
  </div>
  <div class="mp-center"><div class="mp-score" id="mp-score"></div><div class="mp-msg" id="mp-msg"></div></div>
  <div id="rps-bar" class="rps-bar">
    <button class="rps-btn" data-move="rock" data-i18n-attr="aria-label:rock"><svg viewBox="0 0 48 48"><path d="M14 20l6-8 10 1 6 9-3 12-12 3-8-7z" fill="none" stroke-width="3" stroke-linejoin="round"/></svg><b data-i18n="rock"></b><small data-i18n="rockS"></small></button>
    <button class="rps-btn" data-move="paper" data-i18n-attr="aria-label:paper"><svg viewBox="0 0 48 48"><path d="M13 8h16l7 7v25H13z" fill="none" stroke-width="3" stroke-linejoin="round"/><path d="M18 20h13M18 26h13M18 32h9" stroke-width="2.4"/></svg><b data-i18n="paper"></b><small data-i18n="paperS"></small></button>
    <button class="rps-btn" data-move="scissors" data-i18n-attr="aria-label:scissors"><svg viewBox="0 0 48 48"><circle cx="14" cy="35" r="5" fill="none" stroke-width="3"/><circle cx="34" cy="35" r="5" fill="none" stroke-width="3"/><path d="M17 31L34 8M31 31L14 8" stroke-width="3" stroke-linecap="round"/></svg><b data-i18n="scissors"></b><small data-i18n="scissorsS"></small></button>
  </div>
  <button id="btn-undo" class="df-undo mp-undo hidden" data-i18n-attr="aria-label:undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5" fill="none" stroke-width="2.4"/><path d="M4 12h10a6 6 0 0 1 0 12h-2" fill="none" stroke-width="2.4" transform="translate(0,-6)"/></svg><span class="df-undo-txt"><b data-i18n="undo"></b><small data-i18n="undoS"></small></span><span class="df-badge" id="undo-badge">1</span></button>
  <div class="hud-buttons">
    <button id="btn-back" class="icon-btn" data-i18n-attr="title:backTip,aria-label:backTip"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke-width="2.6"/></svg></button>
    <button id="btn-mute" class="icon-btn" data-i18n-attr="title:muteTip,aria-label:muteTip">
      <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke-width="2"/></svg>
    </button>
  </div>
  <div id="demo-tag" class="demo-tag hidden" data-i18n="kit.demo"></div>
  <div id="fps" class="fps hidden">-- FPS</div>
</div>

<div id="screen-start" class="screen hero">
  <div class="panel">
    <div class="kicker" data-i18n="kicker"></div>
    <h1 class="title glitch" id="title" data-i18n="title">賽博小遊戲</h1>
    <div class="title-en" data-i18n="titleEn"></div>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="mode-list">
      <button class="mode-card" id="mode-rps" data-mode="rps"><span class="mc-ico"><svg viewBox="0 0 48 48"><circle cx="14" cy="35" r="5" fill="none" stroke-width="3"/><circle cx="34" cy="35" r="5" fill="none" stroke-width="3"/><path d="M17 31L34 8M31 31L14 8" stroke-width="3" stroke-linecap="round"/></svg></span><span class="mc-txt"><b data-i18n="m.rps"></b><small data-i18n="m.rpsS"></small><em id="mc-rps"></em></span><kbd>1</kbd></button>
      <button class="mode-card" id="mode-xo" data-mode="xo"><span class="mc-ico"><svg viewBox="0 0 48 48"><path d="M8 8l14 14M22 8L8 22" stroke-width="3.4" stroke-linecap="round"/><circle cx="33" cy="33" r="8" fill="none" stroke-width="3.4"/></svg></span><span class="mc-txt"><b data-i18n="m.xo"></b><small data-i18n="m.xoS"></small><em id="mc-xo"></em></span><kbd>2</kbd></button>
      <button class="mode-card" id="mode-react" data-mode="react"><span class="mc-ico"><svg viewBox="0 0 48 48"><path d="M27 4L12 27h11l-3 17 16-24H25z" fill="none" stroke-width="3" stroke-linejoin="round"/></svg></span><span class="mc-txt"><b data-i18n="m.react"></b><small data-i18n="m.reactS"></small><em id="mc-react"></em></span><kbd>3</kbd></button>
    </div>
    <div class="link-row"><a href="./privacy.html" data-i18n="privacy"></a> · <button class="lang-btn" id="btn-lang"></button></div>
  </div>
</div>

<div id="screen-pause" class="screen hidden">
  <div class="panel small">
    <h2 class="title2 glitch" data-i18n="paused">已暫停</h2>
    <div class="title-en" data-i18n="pausedS"></div>
    <button class="neon-btn" id="btn-resume"><span data-i18n="resume"></span><small data-i18n="resumeS"></small></button>
    <button class="neon-btn ghost" id="btn-quit"><span data-i18n="modes"></span><small data-i18n="modesS"></small></button>
    <button class="lang-btn" id="btn-lang2"></button>
  </div>
</div>

<div id="screen-result" class="screen hidden">
  <div class="panel">
    <div class="kicker" id="res-kicker">MATCH OVER</div>
    <h2 class="title2 glitch" id="res-title" data-text="你贏咗！">你贏咗！</h2>
    <div class="title-en" id="res-en">YOU WIN</div>
    <div id="res-record" class="newrecord hidden" data-i18n="kit.newRecord"></div>
    <div class="results" id="res-stats"></div>
    <button class="neon-btn" id="btn-res-main"><span id="res-main-zh">下一位對手</span><small id="res-main-en">NEXT · ENTER</small></button>
    <button class="neon-btn" id="btn-res-reward"><span id="res-reward-main"></span><small id="res-reward-sub">KEEP STREAK · WATCH AD</small></button>
    <button class="neon-btn ghost" id="btn-res-modes"><span data-i18n="modes"></span><small data-i18n="modesS"></small></button>
  </div>
</div>

<div id="loading" class="loading"><div class="ld-text" data-i18n="kit.loading">INSERTING COIN…</div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
