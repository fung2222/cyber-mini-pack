<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05010f">
<meta name="description" content="賽博小遊戲合集 CYBER MINI PACK — 包剪揼、過三關、神經反射三合一 3D 賽博朋克小遊戲。">
<title>賽博小遊戲合集 CYBER MINI PACK · 包剪揼 · 過三關 · 神經反射</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%2305010f%22/%3E%3Ccircle cx=%229%22 cy=%2210%22 r=%225%22 fill=%22none%22 stroke=%22%2300e5ff%22 stroke-width=%222%22/%3E%3Cpath d=%22M18 5l8 8M26 5l-8 8%22 stroke=%22%23ff2bd6%22 stroke-width=%222.4%22/%3E%3Ccircle cx=%2216%22 cy=%2223%22 r=%225%22 fill=%22%233bff8a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/cyber-kit/ui/hud.css">
<link rel="stylesheet" href="./css/game.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/cyber-kit/three/three.module.min.js",
    "three/addons/": "./vendor/cyber-kit/three/addons/",
    "cyber-kit": "./vendor/cyber-kit/kit.js",
    "cyber-kit/": "./vendor/cyber-kit/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="fx-flash"></div>
<div id="scanlines"></div>

<div id="hud" class="hidden">
  <div class="hud-panel hud-left">
    <div class="stat"><div class="label" id="hud-mode">包剪揼 <span>RPS</span></div><div class="value" id="hud-opp">亂嚟仔</div></div>
  </div>
  <div class="hud-panel hud-right">
    <div class="stat"><div class="label" id="hud-stat-label">連勝 <span>STREAK</span></div><div class="value big" id="hud-stat">0</div></div>
  </div>
  <div class="mp-center"><div class="mp-score" id="mp-score"></div><div class="mp-msg" id="mp-msg"></div></div>
  <div id="rps-bar" class="rps-bar">
    <button class="rps-btn" data-move="rock" aria-label="揼 石頭"><svg viewBox="0 0 48 48"><path d="M14 20l6-8 10 1 6 9-3 12-12 3-8-7z" fill="none" stroke-width="3" stroke-linejoin="round"/></svg><b>揼</b><small>ROCK · 1</small></button>
    <button class="rps-btn" data-move="paper" aria-label="包 布"><svg viewBox="0 0 48 48"><path d="M13 8h16l7 7v25H13z" fill="none" stroke-width="3" stroke-linejoin="round"/><path d="M18 20h13M18 26h13M18 32h9" stroke-width="2.4"/></svg><b>包</b><small>PAPER · 2</small></button>
    <button class="rps-btn" data-move="scissors" aria-label="剪 較剪"><svg viewBox="0 0 48 48"><circle cx="14" cy="35" r="5" fill="none" stroke-width="3"/><circle cx="34" cy="35" r="5" fill="none" stroke-width="3"/><path d="M17 31L34 8M31 31L14 8" stroke-width="3" stroke-linecap="round"/></svg><b>剪</b><small>SCISSORS · 3</small></button>
  </div>
  <button id="btn-undo" class="df-undo mp-undo hidden" aria-label="悔棋"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5" fill="none" stroke-width="2.4"/><path d="M4 12h10a6 6 0 0 1 0 12h-2" fill="none" stroke-width="2.4" transform="translate(0,-6)"/></svg><span class="df-undo-txt"><b>悔棋</b><small>UNDO · Z</small></span><span class="df-badge" id="undo-badge">1</span></button>
  <div class="hud-buttons">
    <button id="btn-back" class="icon-btn" title="返回選單 (Esc)" aria-label="返回選單"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke-width="2.6"/></svg></button>
    <button id="btn-mute" class="icon-btn" title="靜音 (M)" aria-label="靜音">
      <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke-width="2"/></svg>
    </button>
  </div>
  <div id="demo-tag" class="demo-tag hidden">DEMO · 自動示範</div>
  <div id="fps" class="fps hidden">-- FPS</div>
</div>

<div id="screen-start" class="screen hero">
  <div class="panel">
    <div class="kicker">NEON KOWLOON · ARCADE CORNER</div>
    <h1 class="title glitch" data-text="賽博小遊戲">賽博小遊戲</h1>
    <div class="title-en">CYBER MINI PACK</div>
    <p class="tagline">三款經典街頭小遊戲，一部機玩晒。揀一款開始：</p>
    <div class="mode-list">
      <button class="mode-card" id="mode-rps" data-mode="rps"><span class="mc-ico"><svg viewBox="0 0 48 48"><circle cx="14" cy="35" r="5" fill="none" stroke-width="3"/><circle cx="34" cy="35" r="5" fill="none" stroke-width="3"/><path d="M17 31L34 8M31 31L14 8" stroke-width="3" stroke-linecap="round"/></svg></span><span class="mc-txt"><b>包剪揼</b><small>ROCK · PAPER · SCISSORS</small><em id="mc-rps">3 個 AI 性格 · 三局兩勝</em></span><kbd>1</kbd></button>
      <button class="mode-card" id="mode-xo" data-mode="xo"><span class="mc-ico"><svg viewBox="0 0 48 48"><path d="M8 8l14 14M22 8L8 22" stroke-width="3.4" stroke-linecap="round"/><circle cx="33" cy="33" r="8" fill="none" stroke-width="3.4"/></svg></span><span class="mc-txt"><b>過三關</b><small>TIC-TAC-TOE LADDER</small><em id="mc-xo">逐級挑戰 3 部 AI</em></span><kbd>2</kbd></button>
      <button class="mode-card" id="mode-react" data-mode="react"><span class="mc-ico"><svg viewBox="0 0 48 48"><path d="M27 4L12 27h11l-3 17 16-24H25z" fill="none" stroke-width="3" stroke-linejoin="round"/></svg></span><span class="mc-txt"><b>神經反射</b><small>REACTION TEST</small><em id="mc-react">綠燈一著即撳 · 偷步會被捉</em></span><kbd>3</kbd></button>
    </div>
    <div class="link-row"><a href="./privacy.html">私隱政策 Privacy</a></div>
  </div>
</div>

<div id="screen-pause" class="screen hidden">
  <div class="panel small">
    <h2 class="title2 glitch" data-text="已暫停">已暫停</h2>
    <div class="title-en">PAUSED</div>
    <button class="neon-btn" id="btn-resume"><span>繼續</span><small>RESUME · P</small></button>
    <button class="neon-btn ghost" id="btn-quit"><span>返回選單</span><small>MODE SELECT</small></button>
  </div>
</div>

<div id="screen-result" class="screen hidden">
  <div class="panel">
    <div class="kicker" id="res-kicker">MATCH OVER</div>
    <h2 class="title2 glitch" id="res-title" data-text="你贏咗！">你贏咗！</h2>
    <div class="title-en" id="res-en">YOU WIN</div>
    <div id="res-record" class="newrecord hidden">★ 新紀錄 NEW RECORD ★</div>
    <div class="results" id="res-stats"></div>
    <button class="neon-btn" id="btn-res-main"><span id="res-main-zh">下一位對手</span><small id="res-main-en">NEXT · ENTER</small></button>
    <button class="neon-btn" id="btn-res-reward"><span>保住連勝</span><small id="res-reward-sub">KEEP STREAK · WATCH AD</small></button>
    <button class="neon-btn ghost" id="btn-res-modes"><span>返回選單</span><small>MODE SELECT</small></button>
  </div>
</div>

<div id="loading" class="loading"><div class="ld-text">INSERTING COIN…</div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
